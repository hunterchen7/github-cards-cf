# Cloudflare Workers config for github-cards-cf.
#
# Setup (one time):
#   1. npm install
#   2. npx wrangler kv namespace create CARDS_KV
#      -> copy the returned `id` into [[kv_namespaces]] below.
#   3. npx wrangler secret put GITHUB_TOKEN
#      -> paste a GitHub PAT (classic: read:user, public_repo; or a fine-grained
#         token with read access to public profile + repositories). Only public
#         data is read.
#   4. npm run deploy
#
# Local dev: put GITHUB_TOKEN in a .dev.vars file (see .dev.vars.example) and run
# `npm run dev`. Wrangler provides a local KV simulation automatically.

name = "github-cards-cf"
main = "src/index.ts"
compatibility_date = "2024-11-06"
account_id = "e279bdf8038be9bfccc6dda153c9ac71"

# Tunables (non-secret). Overridable per-environment.
[vars]
# How long a cached per-user data blob is considered "fresh" before we try to
# refetch from GitHub (seconds). An access within this window is served straight
# from KV — GitHub is not touched. On refetch failure we still serve the stale
# blob (API-failure resilience). 1 hour.
CACHE_FRESH_SECONDS = "3600"
# How long the browser / GitHub camo proxy may cache the rendered SVG (seconds). 1 hour.
BROWSER_CACHE_SECONDS = "3600"
# How long a rendered SVG lives in the Cloudflare edge Cache API (seconds). 1 hour.
EDGE_CACHE_SECONDS = "3600"

# Persistent last-known-good cache. Run the `wrangler kv namespace create`
# command above and paste the id here. `preview_id` is used by `wrangler dev`.
[[kv_namespaces]]
binding = "CARDS_KV"
id = "9da821a524364355a99105821aac126f"

[observability]
enabled = true

[placement]
mode = "smart"
